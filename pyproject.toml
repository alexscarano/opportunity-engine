[project]
name = "opportunity-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.3.3",
    "numpy>=2.3.3",
    "scipy>=1.16.2",
    "statsmodels>=0.14.5",
    "scikit-learn>=1.7.2",
    "holidays>=0.82",
    "matplotlib>=3.10.7",
    "plotly",
    "streamlit>=1.20.0",
    "streamlit-cookies-controller",
    "google-generativeai>=0.8.5",
    "python-dotenv>=1.1.1",
    "fastapi>=0.158.1",
    "uvicorn[standard]>=0.50.0",
    "sqlalchemy>=2",
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.6",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
